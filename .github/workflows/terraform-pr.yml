name: terraform-pr

on:
  pull_request:
    paths:
      - "workload/**"
      - "modules/**"
      - ".github/workflows/terraform-pr.yml"

# id-token: write lets the job request an OIDC token from GitHub
permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - workload/dev/persistent/ci-oidc
          - workload/dev/persistent/dns
          - workload/dev/persistent/network
          - workload/dev/persistent/registry
          - workload/dev/persistent/messaging
          - workload/dev/persistent/identity
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: .

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::701254204984:role/tf-plan
          aws-region: ap-southeast-1

      - name: who am I
        run: aws sts get-caller-identity

      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color
